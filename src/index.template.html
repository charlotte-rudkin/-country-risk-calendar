<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8D0442">
<title>Country Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar-head">
      <p class="brand">Country Calendar</p>
      <p class="brand-sub">Political risk &amp; credit — modular prototype</p>
    </div>
    <div class="search-wrap">
      <input class="search-input" id="search" type="text" placeholder="Search countries…" />
    </div>
    <ul class="country-list" id="overviewNav" style="padding:6px 0 0; border-bottom:1px solid var(--hairline);">
      <li class="country-item" id="overviewBtn" style="font-size:14px;">
        <span style="display:flex;align-items:center;gap:10px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
          <span class="cname">Overview</span>
        </span>
      </li>
    </ul>
    <ul class="country-list" id="countryList"></ul>
    <div class="sidebar-foot">
      15 pilot countries shown. Colour-coding on the Overview map reflects current standing only — active FATF/Paris Club status and pending items — never past history, so an old resolved event never keeps a country flagged.
    </div>
  </aside>

  <main class="main" id="main"></main>

</div>

<script src="data/config.js"></script>
<script src="data/countries.js"></script>
<script src="data/history.js"></script>
<script src="data/map-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
