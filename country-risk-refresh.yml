name: Refresh country-risk monitoring

on:
  schedule:
    - cron: "17 * * * *"       # one country-news bundle each hour
    - cron: "41 6 * * 1"       # weekly timeline screen
    - cron: "23 6 1 * *"       # monthly structured-risk review
    - cron: "53 6 1 1,4,7,10 *" # quarterly history backfill
  workflow_dispatch:
    inputs:
      task:
        description: Refresh task
        required: true
        default: news
        type: choice
        options: [news-bundle, news, timeline, structured, backfill]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Select scheduled task
        id: task
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_TASK: ${{ inputs.task }}
        run: |
          if [ -n "$MANUAL_TASK" ]; then task="$MANUAL_TASK";
          elif [ "$SCHEDULE" = "17 * * * *" ]; then task="news-bundle";
          elif [ "$SCHEDULE" = "41 6 * * 1" ]; then task="timeline";
          elif [ "$SCHEDULE" = "23 6 1 * *" ]; then task="structured";
          else task="backfill"; fi
          echo "name=$task" >> "$GITHUB_OUTPUT"
      - name: Run refresh
        shell: bash
        env:
          TASK: ${{ steps.task.outputs.name }}
        run: |
          case "$TASK" in
            news) node tools/update-news.mjs ;;
            news-bundle)
              hour=$(date -u +%H)
              index=$((10#$hour))
              NEWS_BUNDLE_INDEX="$index" NEWS_BUNDLE_COUNT=24 node tools/update-news.mjs
              ;;
            timeline) node tools/build-review-queues.mjs --mode=weekly ;;
            structured) node tools/build-review-queues.mjs --mode=structured ;;
            backfill) node tools/build-review-queues.mjs --mode=backfill ;;
            *) exit 2 ;;
          esac
      - name: Validate and rebuild site
        run: npm run validate
      - name: Commit verified changes
        id: commit
        shell: bash
        env:
          TASK: ${{ steps.task.outputs.name }}
        run: |
          if git diff --quiet; then
            echo "No publishable changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          git commit -m "data: automated $TASK refresh"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
      - name: Prepare deployment directory
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy refreshed site
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
