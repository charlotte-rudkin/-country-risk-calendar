name: Refresh economic and trade data

on:
  schedule:
    - cron: "29 7 2 * *"       # monthly IMF and World Bank refresh
    - cron: "47 7 3-26 1,4,7,10 *" # quarterly Comtrade refresh split into 24 daily batches
  workflow_dispatch:
    inputs:
      scope:
        description: Data source to refresh (audit makes no data changes)
        type: choice
        default: audit
        options: [audit, macro, trade, commodity, all]
      jurisdiction:
        description: ISO3 code (AGO), profiles, or blank for selected bundle
        type: string
        default: AGO
      bundle_count:
        description: Number of bundles
        type: string
        default: "24"
      bundle_index:
        description: Zero-based bundle number
        type: string
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Select refresh scope
        id: scope
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          COUNTRY: ${{ inputs.jurisdiction }}
          COUNT: ${{ inputs.bundle_count }}
          INDEX: ${{ inputs.bundle_index }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then
            COUNTRY=""
            COUNT=1
            INDEX=0
            case "$SCHEDULE" in
              "29 7 2 * *") SCOPE=macro ;;
              "47 7 3-26 1,4,7,10 *") SCOPE=trade; COUNT=24; INDEX=$((10#$(date -u +%d)-3)) ;;
              *) echo "Unknown schedule"; exit 1 ;;
            esac
          fi
          case "$SCOPE" in audit|macro|trade|commodity|all) ;; *) exit 1 ;; esac
          [[ "$COUNT" =~ ^[0-9]+$ && "$INDEX" =~ ^[0-9]+$ ]] || exit 1
          (( COUNT >= 1 && COUNT <= 197 && INDEX < COUNT )) || exit 1
          [[ -z "$COUNTRY" || "$COUNTRY" == profiles || "$COUNTRY" =~ ^[A-Z]{3}$ ]] || exit 1
          echo "Scope=$SCOPE; country=$COUNTRY; bundle=$INDEX/$COUNT"
          echo "name=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "country=$COUNTRY" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "index=$INDEX" >> "$GITHUB_OUTPUT"
      - name: Refresh economic data
        if: steps.scope.outputs.name != 'audit'
        timeout-minutes: 20
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          UNCTAD_DATA_URL: ${{ secrets.UNCTAD_DATA_URL }}
          SCOPE: ${{ steps.scope.outputs.name }}
          COUNTRY: ${{ steps.scope.outputs.country }}
          ECONOMIC_BUNDLE_COUNT: ${{ steps.scope.outputs.count }}
          ECONOMIC_BUNDLE_INDEX: ${{ steps.scope.outputs.index }}
        shell: bash
        run: |
          args=("--scope=$SCOPE")
          if [ -n "$COUNTRY" ]; then args+=("--country=$COUNTRY"); fi
          printf 'Updater argument: %s\n' "${args[@]}"
          node tools/update-economic.mjs "${args[@]}"
      - name: Audit economic coverage
        run: node tools/audit-economic.mjs
      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: economic-coverage
          path: audit-output/
      - name: Validate and rebuild site
        if: steps.scope.outputs.name != 'audit'
        run: npm run validate
      - name: Commit verified changes
        if: steps.scope.outputs.name != 'audit'
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No publishable changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/economics.js index.html
          git commit -m "data: refresh economic and trade indicators"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: steps.scope.outputs.name != 'audit' && (steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v5
      - name: Prepare deployment directory
        if: steps.scope.outputs.name != 'audit' && (steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        if: steps.scope.outputs.name != 'audit' && (steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy refreshed site
        if: steps.scope.outputs.name != 'audit' && (steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        id: deployment
        uses: actions/deploy-pages@v4
