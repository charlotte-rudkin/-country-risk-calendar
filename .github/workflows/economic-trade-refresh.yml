name: Refresh economic and trade data

on:
  schedule:
    - cron: "29 7 2 * *"       # monthly IMF and World Bank refresh
    - cron: "47 7 2 1,4,7,10 *" # quarterly OEC trade refresh
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: economic-trade-refresh
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Select refresh scope
        id: scope
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "29 7 2 * *" ]; then
            scope="macro"
          elif [ "$SCHEDULE" = "47 7 2 1,4,7,10 *" ]; then
            scope="trade"
          else
            scope="all"
          fi
          echo "name=$scope" >> "$GITHUB_OUTPUT"
      - name: Refresh economic data
        env:
          OEC_API_TOKEN: ${{ secrets.OEC_API_TOKEN }}
        run: node tools/update-economic.mjs --scope=${{ steps.scope.outputs.name }}
      - name: Validate and rebuild site
        run: npm run validate
      - name: Commit verified changes
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No publishable changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/economics.js index.html
          git commit -m "data: refresh economic and trade indicators"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
      - name: Prepare deployment directory
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy refreshed site
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
