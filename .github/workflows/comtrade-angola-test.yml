name: Test free Comtrade access - Angola
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Fetch Angola trade data
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: node tools/test-comtrade-access.mjs
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angola-comtrade-test
          path: comtrade-test-output/
